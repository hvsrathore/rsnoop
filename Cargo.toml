[package]
name = "rsnoop"
version = "0.1.0"
edition = "2024"
authors = ["Harsh Vardhan <4444hv@gmail.com>"]
description = "High-performance network packet sniffer in Rust with real-time stdout multi-protocol decoding and directional tracking (TX/RX)"
license = "MIT"
repository = "https://github.com/hvsrathore/rsnoop"
readme = "README.md"
keywords = ["packet-sniffer", "network", "pcap", "wireshark", "bpf"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
ctrlc = "3.5.2"
etherparse = "0.21.0"
httparse = "1.10.1"
libc = "0.2.191"
pcap = "2.5.0"
tls-parser = "0.12.2"
